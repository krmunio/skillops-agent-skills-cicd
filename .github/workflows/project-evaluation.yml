name: Project evaluation and dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'project_profiles.json'
      - '*.py'
      - 'eval/**'
      - 'skills/**'
      - 'dashboard/**'
      - '.github/workflows/project-evaluation.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Optional catalog project ID; empty evaluates the entire catalog'
        type: string
        default: ''
      live:
        description: 'Authorize billable execution for this dispatch using configured limits'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skillops-project-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SKILLOPS_CONTAINER_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned Python image for actual container controls
        run: |
          docker pull python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          docker tag python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea python:3.12-slim
          docker pull node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
          docker tag node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 node:22-slim
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 project_results.py catalog
      - name: Verify actual sample reports with model execution disabled
        env:
          SKILLOPS_LIVE_EVALUATION_ENABLED: 'false'
        run: |
          cp -R results ci-sample-results
          set +e
          python3 project_evaluation.py --output ci-sample-results --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source-commit "$(git rev-parse HEAD)"
          assessment_status=$?
          set -e
          test "$assessment_status" -eq 2
          python3 project_results.py validate --results ci-sample-results
          SKILLOPS_SAMPLE_REPORTS_DIR=ci-sample-results python3 -m unittest discover -s tests -p 'test_project_sample_integration.py' -v
          printf 'Sample report contracts verified. Guide assessment remains blocked; live model execution was disabled.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain validated non-model onboarding evidence separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sample-onboarding-results
          path: |
            ci-sample-results/index.json
            ci-sample-results/*/index.json
            ci-sample-results/*/*/report.json
            ci-sample-results/*/*/skill-snapshots.json
            ci-sample-results/*/*/skill-evolution.json
            ci-sample-results/*/*/skill-assessments.json
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: contracts
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read prior validated identity history inside the serialized run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: evaluation-results
          path: .prior-results
          persist-credentials: false
      - name: Install pinned runtime only for enabled live evaluation
        if: vars.SKILLOPS_LIVE_EVALUATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.live)
        run: |
          npm ci --no-audit --no-fund
          docker pull python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          docker tag python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea python:3.12-slim
          docker pull node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
          docker tag node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 node:22-slim
          docker image inspect python:3.12-slim node:22-slim --format '{{.Id}}'
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Assess projects or record explicit blocked prerequisites
        env:
          SOURCE_SHA: ${{ github.sha }}
          RESULT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          PROJECT_ID: ${{ inputs.project }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SKILLOPS_LIVE_EVALUATION_ENABLED: ${{ vars.SKILLOPS_LIVE_EVALUATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.live) }}
          SKILLOPS_MAX_INVOCATIONS: ${{ vars.SKILLOPS_MAX_INVOCATIONS }}
          SKILLOPS_MAX_SECONDS: ${{ vars.SKILLOPS_MAX_SECONDS }}
          SKILLOPS_MAX_AI_CREDITS_PER_SESSION: ${{ vars.SKILLOPS_MAX_AI_CREDITS_PER_SESSION }}
          SKILLOPS_ACTIONS_PROGRESS: 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          args=()
          if [ -n "$PROJECT_ID" ]; then args+=(--project "$PROJECT_ID"); fi
          python3 project_evaluation.py --output ci-results --run-id "$RESULT_RUN" --source-commit "$SOURCE_SHA" --history .prior-results/results "${args[@]}"
      - name: Summarize baseline and project evaluation
        if: always()
        env:
          RESULT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 evaluation_reporting.py --results ci-results --run-id "$RESULT_RUN" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain public-safe reports, including blocked outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-project-results
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  persist:
    needs: evaluate
    if: always() && github.ref == 'refs/heads/main' && (needs.evaluate.result == 'success' || needs.evaluate.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Use trusted current publisher code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Open the data branch without executing its content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: evaluation-results
          path: .results-worktree
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-project-results
          path: ci-results
      - name: Validate and append immutable reports with bounded push retries
        shell: bash
        run: |
          set -euo pipefail
          python3 project_results.py validate --results ci-results
          for attempt in 1 2 3 4 5; do
            git -C .results-worktree fetch origin evaluation-results
            target="$RUNNER_TEMP/results-attempt-$attempt"
            git -C .results-worktree worktree add --detach "$target" FETCH_HEAD
            python3 project_results.py merge --incoming ci-results --results "$target/results"
            git -C "$target" add -- results
            if git -C "$target" diff --cached --quiet; then
              exit 0
            fi
            git -C "$target" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "data: append project evaluation results"
            if git -C "$target" push origin HEAD:refs/heads/evaluation-results; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::Result publication failed after five attempts; no force push was used."
          exit 1

  deploy:
    needs: persist
    if: always() && github.ref == 'refs/heads/main' && needs.persist.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: skillops-dashboard-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Fetch newest durable results after entering the deployment slot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: evaluation-results
          path: .results-worktree
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: python3 project_results.py build --results .results-worktree/results --output .dashboard-public/site
      - name: Deploy only static assets and validated public results
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.SKILLOPS_SWA_DEPLOYMENT_TOKEN }}
        run: |
          test -n "$SWA_CLI_DEPLOYMENT_TOKEN" || { echo "::error::SWA deployment secret is missing."; exit 1; }
          npx swa deploy .dashboard-public/site --env production
